version: 2

project_name: stardust

before:
  hooks:
    - go mod tidy

builds:
  - id: stardust
    main: ./cmd/stardust
    binary: stardust
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt

signs:
  - id: checksums
    cmd: openssl
    args:
      - dgst
      - -sha256
      - -sign
      - '{{ .Env.STARDUST_RELEASE_SIGNING_KEY_FILE }}'
      - -out
      - '${signature}'
      - '${artifact}'
    signature: '${artifact}.sig'
    artifacts: checksum

release:
  prerelease: auto
