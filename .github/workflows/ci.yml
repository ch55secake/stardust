name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    uses: ch55secake/cheesecake-factory/.github/workflows/go-build.yml@ad918beeae2a690d153e1153fadb8e1d82a3ee02
    with:
      build-command: go build ./cmd/stardust
      test-command: go test ./...

  lint:
    name: lint
    uses: ch55secake/cheesecake-factory/.github/workflows/go-lint.yml@ad918beeae2a690d153e1153fadb8e1d82a3ee02
    with:
      golangci-lint-version: v2.14.0

  vulnerability-scan:
    name: vulnerability-scan
    uses: ch55secake/cheesecake-factory/.github/workflows/go-vuln.yml@ad918beeae2a690d153e1153fadb8e1d82a3ee02
    with:
      go-package: ./...
      go-version-input: '1.26.9'

  installer-tests:
    name: installer-tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: verify-non-root
        run: test "$(id -u)" -ne 0

      - name: test-installer
        run: make test-install

  systemd:
    name: systemd-integration
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set-up-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      - name: verify-systemd-deployment
        run: sudo bash deploy/systemd/test.sh

  darwin-build:
    name: darwin-build-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set-up-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build-darwin
        env:
          CGO_ENABLED: '0'
          GOARCH: ${{ matrix.arch }}
          GOOS: darwin
        run: go build ./cmd/stardust

  launchd-plist:
    name: launchd-plist
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: validate-launchd-plist
        run: |
          plutil -lint deploy/launchd/com.ch55secake.stardust.plist
          cp deploy/launchd/com.ch55secake.stardust.plist "$RUNNER_TEMP/stardust.plist"
          plutil -replace ProgramArguments -array "$RUNNER_TEMP/stardust.plist"
          plutil -insert ProgramArguments -string /usr/local/bin/stardust -append "$RUNNER_TEMP/stardust.plist"
          plutil -insert ProgramArguments -string --listen -append "$RUNNER_TEMP/stardust.plist"
          plutil -insert ProgramArguments -string 127.0.0.1:8787 -append "$RUNNER_TEMP/stardust.plist"
          plutil -replace UserName -string runner "$RUNNER_TEMP/stardust.plist"
          plutil -replace GroupName -string staff "$RUNNER_TEMP/stardust.plist"
          plutil -replace StandardOutPath -string /Library/Logs/Stardust/stdout.log "$RUNNER_TEMP/stardust.plist"
          plutil -replace StandardErrorPath -string /Library/Logs/Stardust/stderr.log "$RUNNER_TEMP/stardust.plist"
          plutil -lint "$RUNNER_TEMP/stardust.plist"
          test "$(plutil -extract ProgramArguments raw -o - "$RUNNER_TEMP/stardust.plist")" = 3
          test "$(plutil -extract ProgramArguments.0 raw -o - "$RUNNER_TEMP/stardust.plist")" = /usr/local/bin/stardust
          test "$(plutil -extract ProgramArguments.1 raw -o - "$RUNNER_TEMP/stardust.plist")" = --listen
          test "$(plutil -extract ProgramArguments.2 raw -o - "$RUNNER_TEMP/stardust.plist")" = 127.0.0.1:8787
