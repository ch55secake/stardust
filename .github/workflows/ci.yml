name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    uses: ch55secake/cheesecake-factory/.github/workflows/go-build.yml@ad918beeae2a690d153e1153fadb8e1d82a3ee02
    with:
      build-command: go build ./cmd/stardust
      test-command: go test ./...

  lint:
    name: lint
    uses: ch55secake/cheesecake-factory/.github/workflows/go-lint.yml@ad918beeae2a690d153e1153fadb8e1d82a3ee02
    with:
      golangci-lint-version: v2.14.0

  vulnerability-scan:
    name: vulnerability-scan
    uses: ch55secake/cheesecake-factory/.github/workflows/go-vuln.yml@ad918beeae2a690d153e1153fadb8e1d82a3ee02
    with:
      go-package: ./...
      go-version-input: '1.26.9'

  systemd:
    name: systemd-integration
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set-up-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      - name: verify-systemd-deployment
        run: sudo bash deploy/systemd/test.sh

  darwin-build:
    name: darwin-build-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set-up-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build-darwin
        env:
          CGO_ENABLED: '0'
          GOARCH: ${{ matrix.arch }}
          GOOS: darwin
        run: go build ./cmd/stardust
